name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-unitarios:
    name: API — testes unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: consumidor/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  api-integracao:
    name: API — integração (Docker + TimescaleDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Suíte completa no Docker Compose com banco temporário
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from test
      - name: Encerrar contêineres
        if: always()
        run: docker compose -f compose.test.yaml down -v
      - name: Imagem de produção compila
        run: docker build --target runtime -t ecos-api ./consumidor

  mobile:
    name: App React Native — testes e typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  firmware:
    name: Firmware ESP32 — compilação PlatformIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('produtor/platformio.ini') }}
      - run: pip install platformio
      - name: Credenciais de exemplo (somente para compilar)
        run: cp produtor/secrets.example.h produtor/secrets.h
      - run: pio run -d produtor
