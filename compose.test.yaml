name: ecos-test
services:
  db:
    image: timescale/timescaledb:2.23.0-pg17
    environment:
      POSTGRES_DB: ecos_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: disposable-test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ecos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    build:
      context: ./consumidor
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test:disposable-test-password@db:5432/ecos_test
    depends_on:
      db:
        condition: service_healthy
